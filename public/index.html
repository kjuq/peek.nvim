<!DOCTYPE html>
<html lang="en">

<head>
  <title>Peek preview</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="github-markdown.min.css" rel="stylesheet" />
  <link href="katex.min.css" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" />
</head>

<body class="peek-body" data-theme="dark">
  <base id="peek-base" />
  <nav id="peek-toolbar">
    <button id="peek-back" class="peek-toolbar-button" title="Back" disabled>
      <svg viewBox="0 0 16 16" width="16" height="16"><path d="M10 3 5 8l5 5" /></svg>
    </button>
    <button id="peek-forward" class="peek-toolbar-button" title="Forward" disabled>
      <svg viewBox="0 0 16 16" width="16" height="16"><path d="m6 3 5 5-5 5" /></svg>
    </button>
  </nav>
  <main id="peek-markdown-body" class="markdown-body">
    <div class="peek-loader"></div>
  </main>
  <div id="peek-label"></div>
  <script src="mermaid.min.js"></script>
  <script src="script.bundle.js"></script>
</body>

</html>
